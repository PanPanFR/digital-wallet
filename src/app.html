<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#0ea5e9" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
	<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
	<script>
		(function () {
			try {
				var t = localStorage.getItem('ft-theme');
				if (t !== 'light' && t !== 'dark') {
					t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				}
				var el = document.documentElement;
				el.classList.remove('light', 'dark');
				el.classList.add(t);
			} catch (e) {}
		})();
	</script>
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('/sw.js').catch(function () {});
			});
		}
	</script>
	%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
