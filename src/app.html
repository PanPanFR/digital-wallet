<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#ea580c" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
	<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
	<script>
		(function () {
			try {
				var t = localStorage.getItem('ft-theme');
				if (t !== 'light' && t !== 'dark') {
					t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
				}
				var el = document.documentElement;
				el.classList.remove('light', 'dark');
				el.classList.add(t);
			} catch (e) {}
		})();
	</script>
	%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
